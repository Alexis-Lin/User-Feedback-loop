<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>General 问题反馈原型 · ATOM</title>
<style>
:root{
  --ink:#111214; --ink2:#6b6b70; --ink3:#7c7c83;
  --line:#e5e5ea; --sep:#ececf0; --bg:#f2f2f7; --card:#fff;
  --lime:#c6f24e; --sel:#f4f7e6; --selbd:#cfe07f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);}
.stage{display:flex;gap:26px;align-items:flex-start;justify-content:center;min-height:100vh;padding:28px 20px;flex-wrap:wrap;}
.side{width:214px;flex:none;padding-top:8px;}
.side h1{font-size:15px;margin:0 0 6px;}
.side p{font-size:13px;color:var(--ink2);line-height:1.6;margin:0 0 12px;}
.dl{font-size:12px;color:var(--ink3);display:block;margin-bottom:4px;}
.drow{display:flex;gap:6px;margin-bottom:10px;}
.side .btn{font-size:13px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;display:block;width:100%;margin-bottom:8px;text-align:left;}
.drow .btn{flex:1;margin-bottom:0;text-align:center;}
.side .btn.on{background:var(--sel);border-color:var(--selbd);}
@media(max-height:930px){.phone{zoom:.86;}}
@media(max-height:800px){.phone{zoom:.76;}}

.phone{position:relative;width:402px;height:840px;background:#000;border-radius:56px;padding:11px;flex:none;box-shadow:0 10px 40px rgba(0,0,0,.16);}
.screen{position:relative;width:100%;height:100%;background:#fff;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;}
.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:126px;height:34px;background:#000;border-radius:999px;z-index:30;}
.sb{display:flex;justify-content:space-between;padding:16px 30px 4px;font-size:15px;font-weight:600;flex:none;}
.batt{display:inline-block;width:26px;height:13px;border:1px solid rgba(0,0,0,.5);border-radius:4px;position:relative;vertical-align:-2px;margin-left:4px;}
.batt::after{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:17px;background:#111;border-radius:2px;}
.nav{display:flex;align-items:center;padding:8px 18px 10px;flex:none;}
.nav .bk{font-size:24px;cursor:pointer;width:30px;}
.nav .ttl{flex:1;text-align:center;font-size:17px;font-weight:600;}
.nav .rt{width:30px;}

.body{flex:1;overflow-y:auto;padding:6px 22px 24px;}
.intro{font-size:15px;color:var(--ink2);line-height:1.5;margin:4px 2px 18px;}
.sect{font-size:15px;font-weight:600;margin:0 0 12px;}

.menu{display:flex;flex-direction:column;gap:10px;}
.mrow{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;background:#fff;}
.mi{width:26px;height:26px;flex:none;color:var(--ink2);margin-right:13px;display:flex;align-items:center;justify-content:center;}
.mi svg{width:23px;height:23px;}
.mtx{flex:1;min-width:0;}
.mrow .t{font-size:16px;}
.mrow .s{font-size:13px;color:var(--ink3);margin-top:2px;}
.mrow .arw{font-size:20px;color:#c4c4c9;flex:none;}

.csblock{margin-top:24px;text-align:center;}
.cstext{font-size:13px;color:var(--ink3);margin-bottom:5px;}
.cslinks{font-size:13px;color:var(--ink3);}
.cslinks a{color:#2a7d46;text-decoration:none;font-weight:500;cursor:pointer;}
.csWxBig{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:12px;background:#f6f9f2;border:1px solid #e0ecd3;border-radius:14px;padding:16px;}
.csWxBig.on{display:flex;}
.csWxBig .qr{border:1px solid #e0ecd3;border-radius:8px;overflow:hidden;}

/* ---------- 上弹抽屉表单 ---------- */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.42);opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:10;}
.dim.open{opacity:1;pointer-events:auto;}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:#fff;border-radius:22px 22px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .30s cubic-bezier(.32,.72,0,1);z-index:11;box-shadow:0 -8px 40px rgba(0,0,0,.14);}
.sheet.open{transform:translateY(0);}
.grab{width:40px;height:5px;background:#d8d8de;border-radius:3px;margin:8px auto 2px;flex:none;}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 20px 6px;flex:none;}
.stitle{font-size:19px;font-weight:600;}
.ssub{font-size:13px;color:var(--ink3);margin-top:3px;}
.xbtn{width:30px;height:30px;border-radius:999px;background:#efeff2;color:#8a8a90;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;font-size:15px;}
.sbody{flex:1;overflow-y:auto;padding:2px 20px 8px;}
.hidden{display:none!important;}

.checks{display:flex;flex-direction:column;margin-top:2px;}
.chk{display:flex;align-items:center;gap:11px;padding:11px 2px;cursor:pointer;}
.cb{width:22px;height:22px;border:2px solid #c9c9ce;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:13px;font-weight:700;}
.chk.on .cb{background:var(--ink);border-color:var(--ink);color:#fff;}
.chk .rt{font-size:16px;}

.mrow.na{margin-top:12px;}
.lab{font-size:15px;font-weight:600;margin:18px 0 9px;}
.lab .o{font-size:12px;font-weight:400;color:#5b6b16;background:#f1f6df;border:1px solid #e2ecc0;border-radius:6px;padding:2px 8px;margin-left:3px;vertical-align:1px;}
.help{font-size:13px;color:var(--ink3);margin:8px 2px 0;line-height:1.5;}
.cnt{font-size:12px;color:var(--ink3);text-align:right;margin-top:6px;}
.fld{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;}
.fld input,.fld textarea{width:100%;border:0;outline:0;font-family:inherit;font-size:16px;color:var(--ink);background:transparent;resize:none;}
.fld textarea{min-height:24px;max-height:120px;overflow-y:auto;line-height:1.5;padding:0;margin:0;display:block;}
.fld input::placeholder,.fld textarea::placeholder{color:var(--ink3);}
.fieldmic{display:flex;align-items:flex-end;gap:10px;}
.micbtn{width:36px;height:36px;border-radius:999px;background:#eef3d6;color:#556417;border:0;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;font-size:17px;}
.recbar{display:none;align-items:center;gap:10px;border:1px solid #e5342f;background:#fdeceb;border-radius:14px;padding:11px 14px;margin-top:10px;}
.rdot{width:11px;height:11px;border-radius:999px;background:#e5342f;animation:pulse 1s infinite;}
@keyframes pulse{50%{opacity:.35;}}
.rtime{font-size:16px;color:#9a2422;font-variant-numeric:tabular-nums;}
.rcap{font-size:13px;color:#9a2422;opacity:.8;flex:1;}
.stopbtn{border:0;background:#e5342f;color:#fff;font-family:inherit;font-size:14px;border-radius:999px;padding:7px 16px;cursor:pointer;}
.clip{display:none;align-items:center;gap:8px;margin-top:10px;background:#f2f4e6;border:1px solid #e0e7bf;color:#54631a;border-radius:999px;padding:8px 12px 8px 14px;font-size:14px;width:max-content;}
.clipx{cursor:pointer;color:#8a985a;padding:0 2px;}

/* 截图：折叠一行 → 展开占位框 */
.shotrow{display:flex;align-items:center;gap:12px;margin-top:6px;}
.shotrow-tx{flex:1;min-width:0;}
.srt{font-size:15px;font-weight:600;}
.srt .o{font-size:12px;font-weight:400;color:#5b6b16;background:#f1f6df;border:1px solid #e2ecc0;border-radius:6px;padding:2px 8px;margin-left:3px;vertical-align:1px;}
.shotadd{width:34px;height:34px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
.shotbox{margin-top:12px;}
.shots{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.shot,.addshot{width:60px;height:60px;border-radius:10px;flex:none;}
.addshot{border:1.5px dashed #cfcfd4;display:flex;align-items:center;justify-content:center;color:var(--ink3);font-size:20px;cursor:pointer;background:#fafafb;}
.shotcap{font-size:13px;color:var(--ink3);}
.shot{background:#dcdce0;position:relative;}
.shot span{position:absolute;top:-6px;right:-6px;width:19px;height:19px;border-radius:999px;background:#141414;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

/* 联系方式：整体框起来的一组，字号偏小 */
.grp{margin-top:20px;border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:#fbfbfc;font-size:14px;}
.grptitle{font-size:13.5px;font-weight:600;margin:0 0 10px;color:var(--ink2);}
.grptitle .o{font-size:11px;font-weight:400;color:#5b6b16;background:#f1f6df;border:1px solid #e2ecc0;border-radius:6px;padding:2px 7px;margin-left:4px;vertical-align:1px;}
.acctmail{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 12px;}
.acctmail .amc{width:20px;height:20px;border-radius:999px;background:#e8f3ea;color:#2e7d4f;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;}
.acctmail .amt{flex:1;min-width:0;}
.acctmail .ae{font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acctmail .as{font-size:11.5px;color:var(--ink3);margin-top:2px;}
.acctmail .amx{font-size:12.5px;color:#2a7d46;font-weight:500;cursor:pointer;flex:none;}
.grp .fld{padding:9px 12px;}
.grp .fld input{font-size:15px;}
.sublab{font-size:13px;color:var(--ink2);font-weight:500;margin:12px 0 7px;}
.sublab .o{font-size:11px;font-weight:400;color:#5b6b16;background:#f1f6df;border:1px solid #e2ecc0;border-radius:6px;padding:2px 7px;margin-left:3px;vertical-align:1px;}
.wecom{display:flex;align-items:center;gap:11px;margin-top:12px;background:#eef6e6;border:1px solid #d5e8c4;border-radius:12px;padding:10px 12px;cursor:pointer;}
.wecom-ic{width:34px;height:34px;border-radius:9px;background:#2aae67;color:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;}
.wecom-tx{flex:1;}
.wecom-tx .t{font-size:14px;color:#1f5c38;font-weight:600;}
.wecom-tx .s{font-size:11.5px;color:#3c7a52;margin-top:2px;line-height:1.4;}
.wecom-qr{width:34px;height:34px;flex:none;border:1px solid #d5e8c4;border-radius:6px;overflow:hidden;background:#fff;}
.wecom-big{display:none;flex-direction:column;align-items:center;gap:10px;margin-top:12px;background:#f6f9f2;border:1px solid #e0ecd3;border-radius:14px;padding:18px;}
.wecom-big.on{display:flex;}
.wecom-big .qr{border:1px solid #e0ecd3;border-radius:8px;overflow:hidden;}
.qh{font-size:13px;color:#3c7a52;}
.consent{display:flex;align-items:flex-start;gap:9px;margin-top:12px;padding-top:11px;border-top:1px solid var(--sep);cursor:pointer;}
.consent .cbx{width:19px;height:19px;border-radius:6px;border:2px solid #c9c9ce;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:11px;font-weight:700;margin-top:1px;}
.consent .cbx.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.consent .ctxt{display:flex;flex-direction:column;gap:2px;}
.consent .ct-main{font-size:12.5px;color:var(--ink2);line-height:1.4;}
.consent .ct-note{font-size:11.5px;color:var(--ink3);line-height:1.4;}
.devnote{display:flex;gap:8px;font-size:12px;color:var(--ink3);margin-top:18px;background:#f6f6f8;border-radius:10px;padding:10px 12px;line-height:1.5;}

.hero{display:flex;gap:14px;align-items:flex-start;margin:4px 0 4px;}
.heroic{width:56px;height:52px;flex:none;background:var(--lime);border-radius:14px 14px 14px 3px;display:flex;align-items:center;justify-content:center;font-size:26px;}
.hero h2{font-size:19px;margin:0 0 4px;}
.hero p{font-size:14px;color:var(--ink2);margin:0;line-height:1.5;}

.foot{flex:none;display:flex;gap:12px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,16px));border-top:1px solid var(--sep);}
.cancel{flex:none;border:0;background:#efeff2;color:var(--ink);font-family:inherit;font-size:15px;border-radius:999px;padding:0 22px;height:50px;cursor:pointer;}
.submit{flex:1;border:0;background:#141414;color:#fff;font-family:inherit;font-size:16px;font-weight:500;border-radius:999px;height:50px;cursor:pointer;}
.submit:disabled{background:#dcdce0;color:#9a9aa0;cursor:not-allowed;}

.thanks{padding:26px 12px 8px;text-align:center;}
.tkic{width:72px;height:72px;border-radius:999px;background:var(--lime);color:#1c2b06;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px;}
.thanks h2{font-size:21px;margin:0 0 8px;}
.thanks p{font-size:14px;color:var(--ink2);margin:0 0 28px;line-height:1.5;}
.satlab{font-size:15px;font-weight:600;margin-bottom:16px;}
.faces{display:flex;justify-content:center;gap:16px;margin-bottom:10px;}
.face{width:60px;height:60px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;}
.face.on{background:var(--sel);border-color:var(--selbd);transform:scale(1.06);}
.facecap{font-size:12px;color:var(--ink3);}
</style>
</head>
<body>
<div class="stage">
<div class="side">
  <h1>General 问题反馈</h1>
  <p>一级列表（APP View）· 点分类上弹抽屉表单，填完即走，不做整页二级跳转。语言(中/英) 与 版本(大陆/国际) 正交。</p>
  <span class="dl">语言 / Language</span>
  <div class="drow"><button class="btn on" id="lZh" onclick="setLang('zh')">中文</button><button class="btn" id="lEn" onclick="setLang('en')">EN</button></div>
  <span class="dl">版本 / Region</span>
  <div class="drow"><button class="btn on" id="rCn" onclick="applyRegion('cn')">大陆</button><button class="btn" id="rIntl" onclick="applyRegion('intl')">国际</button></div>
  <button class="btn" onclick="reset_()">重置 / Reset</button>
  <button class="btn" onclick="openNewAction()">↗ 新动作申请（抽屉）</button>
</div>

<div class="phone"><div class="island"></div><div class="screen">
  <div class="sb"><span>10:59</span><span>LTE <span class="batt"></span></span></div>
  <div class="nav"><span class="bk" style="visibility:hidden">‹</span><span class="ttl" id="ttl">问题反馈</span><span class="rt"></span></div>

  <!-- 一级 APP View：分类列表 -->
  <div class="body" id="v1">
    <div class="sect" id="prompt" style="margin-top:6px;"></div>
    <div class="menu" id="menu"></div>
    <div class="csblock">
      <div class="cstext" id="csText"></div>
      <div class="cslinks"><span id="csMailLab"></span> <a href="mailto:cs@bodypark.fit">cs@bodypark.fit</a><span id="csWx"> · <a id="csWxLink"></a></span></div>
      <div class="csWxBig" id="csWxBig"><div class="qr" style="width:132px;height:132px"></div><div class="qh" id="csWxCap"></div></div>
    </div>
  </div>

  <!-- 上弹抽屉 -->
  <div class="dim" id="dim" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet">
    <div class="grab"></div>
    <div class="shead">
      <div><div class="stitle" id="shTitle"></div><div class="ssub" id="shSub"></div></div>
      <span class="xbtn" onclick="closeSheet()">✕</span>
    </div>
    <div class="sbody" id="sbody">

      <!-- 分类表单 -->
      <div class="pan" id="panForm">
        <div class="checks" id="subs"></div>
        <div class="mrow na hidden" id="naEntry"><span class="mi" id="naEntryIc"></span><div class="mtx"><div class="t" id="naEntryT"></div><div class="s" id="naEntryS"></div></div><span class="arw">›</span></div>

        <div class="lab" id="addLab"></div>
        <div class="fld">
          <div class="fieldmic">
            <textarea id="pText" maxlength="200" rows="1" oninput="grow(this);cnt();updateSubmit()"></textarea>
            <button class="micbtn" onclick="rec.start()">🎙</button>
          </div>
          <div class="cnt" id="pCnt">0/200</div>
        </div>
        <div class="recbar" id="pRec"><span class="rdot"></span><span class="rtime" id="pTime">0:00</span><span class="rcap" id="recCap"></span><button class="stopbtn" id="stopBtn" onclick="rec.stop()"></button></div>
        <div class="clip" id="pClip">▷ <span id="voiceLab"></span> <span id="pClipT">0:00</span> <span class="clipx" onclick="rec.del()">✕</span></div>

        <!-- 截图：折叠一行 → 点 + 展开 -->
        <div class="shotrow" id="shotRow">
          <div class="shotrow-tx"><div class="srt" id="shotSect"></div></div>
          <button class="shotadd" id="shotAdd">+</button>
        </div>
        <div class="shotbox" id="shotBox" hidden>
          <div class="shots" id="shots"><div class="addshot" onclick="addShot()">⊕</div><span class="shotcap" id="shotCap"></span></div>
        </div>

        <!-- 联系方式：成组 section -->
        <div class="grp">
          <div class="grptitle" id="contactTitle"></div>
          <div id="contactIntl">
            <div class="acctmail" id="acctMail">
              <span class="amc">✓</span>
              <div class="amt"><div class="ae">alex@example.com</div><div class="as" id="acctNote"></div></div>
              <a class="amx" id="changeMail"></a>
            </div>
            <div class="fld" id="altWrap" style="display:none;margin-top:10px;"><input id="mail" type="email"></div>
          </div>
          <div id="contactCn">
            <div class="acctmail" id="acctPhone">
              <span class="amc">✓</span>
              <div class="amt"><div class="ae">138****8862</div><div class="as" id="acctPhoneNote"></div></div>
              <a class="amx" id="changePhone"></a>
            </div>
            <div class="fld" id="altPhoneWrap" style="display:none;margin-top:10px;"><input id="cnPhone" type="tel"></div>
            <div class="sublab" id="cnMailLab"></div>
            <div class="fld"><input id="cnMail" type="email"></div>
            <div class="wecom" id="wecom">
              <div class="wecom-ic">企</div>
              <div class="wecom-tx"><div class="t" id="wecomT"></div><div class="s" id="wecomS"></div></div>
              <div class="wecom-qr"></div>
            </div>
            <div class="wecom-big" id="wecomBig"><div class="qr" style="width:150px;height:150px"></div><div class="qh" id="wecomCap"></div></div>
          </div>
          <div class="consent" id="consent"><span class="cbx on" id="consentBox">✓</span><span class="ctxt"><span class="ct-main" id="consentTxt"></span><span class="ct-note" id="consentNote"></span></span></div>
        </div>
      </div>

      <!-- 新动作申请 -->
      <div class="pan hidden" id="panNa">
        <div class="hero"><div class="heroic">🏋</div><div><h2 id="naHeroT"></h2><p id="naHeroP"></p></div></div>
        <div class="lab" id="naNameLab"></div>
        <div class="fld"><input id="naName" oninput="gate()"></div>
        <div class="lab" id="naWhyLab"></div>
        <div class="fld"><textarea id="naWhy" maxlength="200" rows="1" oninput="grow(this)"></textarea></div>
        <div class="help" id="naWhyHelp"></div>
        <div class="lab" id="naRefLab"></div>
        <div class="fld"><input id="naRef"></div>
      </div>

      <!-- 感谢 + 满意度 -->
      <div class="pan hidden" id="panThanks">
        <div class="thanks">
          <div class="tkic">♥</div>
          <h2 id="tkTitle"></h2>
          <p id="tkSub"></p>
          <div class="satlab" id="satLab"></div>
          <div class="faces"><div class="face" onclick="pickFace(this)">😍</div><div class="face" onclick="pickFace(this)">🙂</div><div class="face" onclick="pickFace(this)">😕</div></div>
          <div class="facecap" id="satCap"></div>
        </div>
      </div>

    </div>
    <div class="foot" id="shFoot">
      <button class="cancel" id="btnCancel" onclick="sheetCancel()"></button>
      <button class="submit" id="btnSubmit" onclick="onPrimary()"></button>
    </div>
  </div>

</div></div>
</div>

<script>
const $=s=>document.querySelector(s);

// ---------- 图标（单色极简 line） ----------

  ai:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="7.3"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2.2v3M12 18.8v3M2.2 12h3M18.8 12h3" stroke-linecap="round"/></svg>',

const CATS={
  ai:{icon:'ai',name:{zh:'AI 识别准确性',en:'AI tracking'},sub:{zh:'计数 / 身体识别 / 讲解',en:'Count / pose / coaching'},

};
const ORDER=['ai','content','connect','otherfb','feature'];

let lang='zh', region='cn', pan='form', cat='', naFrom='';
function t(k){return L[lang][k];}
function cn(o){return o[lang];}

function renderMenu(){
  $('#menu').innerHTML = ORDER.map(k=>`<div class="mrow" data-k="${k}"><span class="mi">${ICONS[CATS[k].icon]}</span><div class="mtx"><div class="t">${cn(CATS[k].name)}</div><div class="s">${cn(CATS[k].sub)}</div></div><span class="arw">›</span></div>`).join('');
  document.querySelectorAll('#menu .mrow').forEach(r=>r.onclick=()=>openCat(r.dataset.k));
}

// ---------- 抽屉开合 ----------
function showPanel(p){
  pan=p;
  ['form','na','thanks'].forEach(x=>$('#pan'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('hidden',x!==p));
  $('#sbody').scrollTop=0;
  if(p==='form'){
    $('#btnCancel').textContent=t('cancel');$('#btnCancel').style.display='';
    $('#btnSubmit').textContent=t('submit');updateSubmit();
  }else if(p==='na'){
    $('#btnCancel').textContent = naFrom==='content'?t('back'):t('cancel');$('#btnCancel').style.display='';
    $('#btnSubmit').textContent=t('submitReq');gate();
  }else{ // thanks
    $('#btnCancel').style.display='none';
    $('#btnSubmit').textContent=t('done');$('#btnSubmit').disabled=false;
  }
}
function openSheet(){$('#dim').classList.add('open');$('#sheet').classList.add('open');}
function closeSheet(){$('#dim').classList.remove('open');$('#sheet').classList.remove('open');}

function openCat(k){
  cat=k;naFrom='';
  var C=CATS[k], subsArr=cn(C.subs), isOther=subsArr.length===0;
  $('#shTitle').textContent=cn(C.name);
  $('#shSub').textContent='';
  $('#subs').innerHTML = subsArr.map(s=>`<div class="chk"><span class="cb">✓</span><span class="rt">${s}</span></div>`).join('');
  document.querySelectorAll('#subs .chk').forEach(c=>c.onclick=()=>{c.classList.toggle('on');updateSubmit();});
  $('#naEntry').classList.toggle('hidden', k!=='content');
  $('#addLab').innerHTML = (isOther?cn(C.label):t('addDefault'))+' <span class="o">'+t('optional')+'</span>';
  $('#pText').placeholder = isOther?cn(C.placeholder):t('ph_add');
  $('#pText').value='';grow($('#pText'));cnt();rec.del();$('#pRec').style.display='none';
  collapseShots(true);
  showPanel('form');openSheet();
}
function openNewAction(){naFrom='';$('#naName').value='';$('#naWhy').value='';grow($('#naWhy'));$('#naRef').value='';$('#shTitle').textContent=t('naTitle');$('#shSub').textContent='';showPanel('na');openSheet();}

document.getElementById('naEntry').onclick=()=>{naFrom='content';$('#naName').value='';$('#naWhy').value='';grow($('#naWhy'));$('#naRef').value='';$('#shTitle').textContent=t('naTitle');$('#shSub').textContent='';showPanel('na');};

function gate(){ if(pan==='na')$('#btnSubmit').disabled=$('#naName').value.trim()===''; }
// 表单校验：有选项类需勾选或补充文字/语音；纯文字类需文字/语音，避免空提交
function updateSubmit(){
  if(pan!=='form'||!cat)return;
  var isOther=cn(CATS[cat].subs).length===0;
  var hasSub=document.querySelectorAll('#subs .chk.on').length>0;
  var hasText=$('#pText').value.trim()!=='';
  var hasVoice=$('#pClip').style.display==='inline-flex';
  $('#btnSubmit').disabled = isOther ? !(hasText||hasVoice) : !(hasSub||hasText||hasVoice);
}

function sheetCancel(){
  if(pan==='na'&&naFrom==='content'){ $('#shTitle').textContent=cn(CATS[cat].name);$('#shSub').textContent=t('sheetSub');showPanel('form'); }
  else closeSheet();
}
function onPrimary(){
  if(pan==='thanks'){closeSheet();return;}
  // 提交
  $('#tkTitle').textContent=t('tkTitle');
  $('#tkSub').textContent = pan==='na' ? t('tkSubReq') : (cat==='feature' ? t('tkSubFeat') : t('tkSub'));
  $('#shTitle').textContent=t('tkTitle');$('#shSub').textContent='';
  document.querySelectorAll('.face').forEach(f=>f.classList.remove('on'));
  showPanel('thanks');
}
function pickFace(el){document.querySelectorAll('.face').forEach(f=>f.classList.remove('on'));el.classList.add('on');}

function grow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function cnt(){$('#pCnt').textContent=$('#pText').value.length+'/200';}

// 截图折叠
function collapseShots(reset){
  if(reset){document.querySelectorAll('#shots .shot').forEach(s=>s.remove());}
  $('#shotBox').hidden=true;$('#shotRow').hidden=false;
}
function expandShots(){$('#shotRow').hidden=true;$('#shotBox').hidden=false;addShot();}
function addShot(){
  const b=$('#shots');if(b.querySelectorAll('.shot').length>=3)return;
  const d=document.createElement('div');d.className='shot';d.innerHTML='<span>✕</span>';
  d.querySelector('span').onclick=(e)=>{e.stopPropagation();d.remove();if($('#shots').querySelectorAll('.shot').length===0)collapseShots(false);};
  b.insertBefore(d,b.querySelector('.addshot'));
}
$('#shotAdd').onclick=expandShots;

// 录音（模拟）
var rec={t:null,sec:0,
  start(){$('#pRec').style.display='flex';this.sec=0;$('#pTime').textContent='0:00';
    this.t=setInterval(()=>{this.sec++;$('#pTime').textContent=fmt(this.sec);if(this.sec>=60)rec.stop();},1000);},
  stop(){clearInterval(this.t);$('#pRec').style.display='none';
    if(this.sec>0){$('#pClip').style.display='inline-flex';$('#pClipT').textContent=fmt(this.sec);}updateSubmit();},
  del(){$('#pClip').style.display='none';updateSubmit();}
};
function fmt(s){return (s/60|0)+':'+(s%60).toString().padStart(2,'0');}

// ---------- 语言 ----------
function setLang(l){lang=l;$('#lZh').classList.toggle('on',l==='zh');$('#lEn').classList.toggle('on',l==='en');applyLang();}
function applyLang(){
  document.documentElement.lang=lang;
  renderMenu();
  $('#ttl').textContent=t('title');
  $('#prompt').textContent=t('prompt');
  $('#csText').textContent=t('csText');$('#csMailLab').textContent=t('csMail');$('#csWxLink').textContent=t('csWx');$('#csWxCap').textContent=t('csWxCap');
  $('#naEntryIc').innerHTML=ICONS.dumbbell;$('#naEntryT').textContent=t('naEntryT');$('#naEntryS').textContent=t('naEntryS');
  $('#shotSect').innerHTML=t('shotSect')+' <span class="o">'+t('optional')+'</span>';$('#shotCap').textContent=t('shotsCap');
  $('#contactTitle').innerHTML=t('contactTitle')+' <span class="o">'+t('optional')+'</span>';
  $('#acctNote').textContent=t('acctNote');$('#changeMail').textContent=t('changeMail');$('#mail').placeholder=t('ph_alt');
  $('#acctPhoneNote').textContent=t('acctPhoneNote');$('#changePhone').textContent=t('changePhone');$('#cnPhone').placeholder=t('ph_altPhone');
  $('#cnMailLab').innerHTML=t('cnMail')+' <span class="o">'+t('optional')+'</span>';$('#cnMail').placeholder=t('ph_cnMail');
  $('#consentTxt').textContent=t('consent');$('#consentNote').textContent=t('consentNote');
  $('#wecomT').textContent=t('wecomT');$('#wecomS').textContent=t('wecomS');$('#wecomCap').textContent=t('wecomCap');
  $('#recCap').textContent=t('recCap');$('#stopBtn').textContent=t('recStop');$('#voiceLab').textContent=t('voice');
  $('#naHeroT').textContent=t('naHeroT');$('#naHeroP').textContent=t('naHeroP');$('#naNameLab').textContent=t('naName');
  $('#naWhyLab').innerHTML=t('naWhy')+' <span class="o">'+t('optional')+'</span>';$('#naWhyHelp').textContent=t('naWhyHelp');
  $('#naRefLab').innerHTML=t('naRef')+' <span class="o">'+t('optional')+'</span>';
  $('#naName').placeholder=t('ph_naName');$('#naWhy').placeholder=t('ph_naWhy');$('#naRef').placeholder=t('ph_naRef');
  $('#tkTitle').textContent=t('tkTitle');$('#satLab').textContent=t('satLab');$('#satCap').textContent=t('satCap');
  // 抽屉打开时刷新按钮 / 标题 / 已选子项文案
  if($('#sheet').classList.contains('open')){
    if(pan==='form'){$('#btnCancel').textContent=t('cancel');$('#btnSubmit').textContent=t('submit');
      if(cat){var C=CATS[cat],subsArr=cn(C.subs),isOther=subsArr.length===0;
        $('#shTitle').textContent=cn(C.name);
        document.querySelectorAll('#subs .chk .rt').forEach((el,i)=>{if(subsArr[i])el.textContent=subsArr[i];});
        $('#addLab').innerHTML=(isOther?cn(C.label):t('addDefault'))+' <span class="o">'+t('optional')+'</span>';
        if(!$('#pText').value)$('#pText').placeholder=isOther?cn(C.placeholder):t('ph_add');}}
    else if(pan==='na'){$('#btnCancel').textContent=naFrom==='content'?t('back'):t('cancel');$('#btnSubmit').textContent=t('submitReq');$('#shTitle').textContent=t('naTitle');}
    else{$('#btnSubmit').textContent=t('done');$('#shTitle').textContent=t('tkTitle');}
  }
}
